name: Bug report
description: Report reproducible lazy-reader behavior that differs from the documentation.
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include the expected behavior and the actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: NixOS version, GNOME/Wayland session, and relevant configuration with secrets removed.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant logs with API keys and personal text removed.
